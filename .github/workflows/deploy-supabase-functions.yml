name: Deploy Supabase Edge Functions

# Keeps the deployed functions (and their supabase/config.toml settings,
# e.g. verify_jwt) permanently in sync with main -- so a fix like disabling
# platform JWT verification for the Stripe billing functions never again
# silently drifts out of sync between what's committed and what's actually
# deployed, and nobody has to remember to redeploy manually or flip a
# dashboard toggle by hand.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        working-directory: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for dir in functions/*/; do
            name=$(basename "$dir")
            echo "Deploying $name..."
            supabase functions deploy "$name" --project-ref ewilgwndhpxibkogxqbk
          done
